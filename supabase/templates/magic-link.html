<!--
  Supabase → Authentication → Emails → Templates → Magic Link
  Subject: קישור כניסה - דירוג היסטרוסקופיה
  Paste this whole file as the message body.
-->
<div dir="rtl" style="font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #1d2333; text-align: right;">
  <p>שלום,</p>
  <p>
    קיבלת את המייל הזה כי ביקשת להיכנס למערכת דירוג ההיסטרוסקופיה של מחקר
    הגינקולוגיה. לחיצה על הקישור תכניס אותך למערכת:
  </p>
  <p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
       style="display: inline-block; padding: 10px 20px; background: #3d4f8f; color: #ffffff; text-decoration: none; border-radius: 8px;">כניסה למערכת</a>
  </p>
  <p style="font-size: 14px; color: #5b6275;">
    הקישור תקף לזמן קצר ועובד פעם אחת בלבד. אם הוא כבר לא עובד, אפשר לבקש קישור
    חדש בדף הכניסה: {{ .SiteURL }}/login
  </p>
  <p style="font-size: 14px; color: #5b6275;">
    אם לא ביקשת להיכנס, אפשר להתעלם מהמייל הזה.
  </p>
</div>
